<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday 💐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1038;--ink2:#3d1a52;--gold:#f6b73c;--rose:#f08fb0;--lav:#c9b6f2;--paper:#fff8ef}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',sans-serif;background:var(--ink);color:var(--paper);line-height:1.7;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.1}
section{padding:4rem 1.25rem;max-width:1000px;margin:auto}
.center{text-align:center}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 1.25rem;
 background:radial-gradient(circle at 50% 30%,var(--ink2),var(--ink) 70%);position:relative}
.tag{color:var(--gold);font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.3rem;margin-bottom:1.5rem}
.portrait{width:min(260px,62vw);aspect-ratio:3/4;border-radius:130px 130px 18px 18px;object-fit:cover;border:4px solid var(--gold);
 box-shadow:0 0 0 10px rgba(246,183,60,.15),0 20px 60px rgba(0,0,0,.5);background:linear-gradient(160deg,var(--rose),var(--lav))}
.hero h1{font-size:clamp(2.8rem,10vw,5.5rem);margin:1.5rem 0 .5rem}
.hero h2{color:var(--rose);font-size:clamp(1.3rem,4vw,1.9rem);font-style:italic;font-weight:500}
.hero p.msg{max-width:560px;margin:1.2rem auto 0;color:#e9dcf5}
button.music{margin-top:1.8rem;background:var(--gold);color:var(--ink);border:0;border-radius:99px;padding:.8rem 1.6rem;font:600 1rem 'Nunito';cursor:pointer}
button.music:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:3px}

/* wishes ticker */
.ticker{overflow:hidden;background:var(--gold);color:var(--ink);padding:.8rem 0;white-space:nowrap}
.ticker div{display:inline-block;animation:slide 40s linear infinite}
.ticker span{margin:0 1.5rem;font-weight:600}
@keyframes slide{to{transform:translateX(-50%)}}

/* cards */
h2.title{font-size:clamp(2rem,6vw,3rem);margin-bottom:.4rem}
.sub{color:var(--lav);margin-bottom:2rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(201,182,242,.25);border-radius:18px;padding:1.5rem}
.card .ic{font-size:2rem}
.card h3{font-size:1.5rem;color:var(--gold);margin:.4rem 0}
.card p{color:#e9dcf5;font-size:.97rem}

/* gallery */
.gallery{columns:3 220px;column-gap:1rem}
.gallery figure{break-inside:avoid;margin-bottom:1rem;background:var(--paper);padding:.6rem .6rem 1rem;border-radius:6px;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.gallery figure:nth-child(odd){transform:rotate(-1.5deg)}
.gallery figure:nth-child(even){transform:rotate(1.2deg)}
.gallery img{width:100%;display:block;border-radius:3px;background:linear-gradient(160deg,var(--rose),var(--lav));min-height:140px}
.gallery figcaption{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;text-align:center;margin-top:.6rem}

/* closing */
.closing{max-width:680px;font-family:'Cormorant Garamond',serif;font-size:1.45rem;line-height:1.55}
.sign{color:var(--rose);margin-top:1.5rem;font-style:italic}
footer{text-align:center;padding:2rem 1rem 3rem;color:var(--lav);font-size:.9rem}

/* falling petals (hero only moment of motion) */
.petal{position:fixed;top:-2rem;pointer-events:none;animation:fall linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ticker div{animation:none}.petal{display:none}}
</style>
</head>
<body>

<header class="hero">
  <p class="tag" id="tagline"></p>
  <img class="portrait" id="mainPhoto" alt="">
  <h1 id="heroTitle"></h1>
  <h2 id="heroSub"></h2>
  <p class="msg" id="heroMsg"></p>
  <button class="music" id="musicBtn" hidden>🎵 Play music</button>
  <audio id="audio" loop></audio>
</header>

<div class="ticker" aria-hidden="true"><div id="ticker"></div></div>

<section>
  <h2 class="title" id="cardsTitle"></h2>
  <p class="sub" id="cardsSub"></p>
  <div class="cards" id="cards"></div>
</section>

<section>
  <h2 class="title" id="galTitle"></h2>
  <p class="sub" id="galSub"></p>
  <div class="gallery" id="gallery"></div>
</section>

<section class="center">
  <p class="closing" id="closing" style="margin:auto"></p>
  <p class="sign" id="sign"></p>
</section>

<footer id="footer"></footer>

<script>
/* ============================================================
   ✏️  EDIT ONLY THIS BLOCK — everything on the page comes from here
   ============================================================
   PHOTOS: put your image files in the SAME folder as this file
   (e.g. photo1.jpg) and write the file name below.
   You can also paste a full web link to an image.
*/
const CONFIG = {
  pageTitle: "Happy Birthday💐",

  // ---- Top of the page ----
  tagline: "A chapter ends, a legend continues ✨",
  mainPhoto: "main.jpg",               // her photo (portrait works best)
  name: "Happy Birthday",
  subtitle: "Thank you for everything 🌸",
  message: "You didn't just teach us — you inspired us. Your presence made every day brighter, and your legacy will live on in each one of us.",

  // ---- Music (optional): add an .mp3 to the folder and put its name, or leave "" ----
  music: "King.mp3",

  // ---- Scrolling wishes strip ----
  wishes: [
    "Best wishes for your new journey",
    "Thank you for your guidance",
    "We will miss you deeply",
    "You are irreplaceable",
    "Always in our hearts"
  ],

  // ---- Cards: add, remove or reorder as you like ----
  cardsTitle: "What you gave us",
  cardsSub: "A few things we will never forget",
  cards: [
    { icon: "💡", title: "Endless wisdom",       text: "Every meeting was a masterclass. You turned complex problems into simple clarity." },
    { icon: "🤝", title: "Unconditional support", text: "Whenever we were stuck, you were there with calm reassurance and the right nudge." },
    { icon: "🌱", title: "You helped us grow",    text: "We came as juniors and leave as better professionals because you trusted us." },
    { icon: "😄", title: "Laughter and joy",      text: "Your humour made even the most stressful days fun. We will miss that energy." }
  ],

  // ---- Photo gallery: add as many as you want ----
  galleryTitle: "Moments we cherish",
  gallerySub: "Memories from our time together",
  photos: [
    { src: "photo1.jpg", caption: "Team lunch, 2023" },
    { src: "photo2.jpg", caption: "Annual day" },
    { src: "photo3.jpg", caption: "That famous trip" },
    { src: "photo4.jpg", caption: "Celebrating the launch" },
    { src: "photo5.jpg", caption: "Just us being us" },
    { src: "photo6.jpg", caption: "Farewell day" }
  ],

  // ---- Closing note ----
  closing: "You have been more than a colleague or a mentor. Wherever your next chapter takes you, know that this team carries a piece of your spirit in everything we do.",
  signOff: "— With love, from your team 💐",
  footer: "💛🌸💜  Made with love by [Your Name]"
};
/* ============================================================
   END OF EDIT AREA — no need to change anything below
   ============================================================ */

const $ = id => document.getElementById(id);
const set = (id, t) => $(id).textContent = t;

document.title = CONFIG.pageTitle;
set('tagline', CONFIG.tagline);
set('heroTitle', CONFIG.name);
set('heroSub', CONFIG.subtitle);
set('heroMsg', CONFIG.message);
$('mainPhoto').src = CONFIG.mainPhoto;
$('mainPhoto').alt = CONFIG.name;
set('cardsTitle', CONFIG.cardsTitle); set('cardsSub', CONFIG.cardsSub);
set('galTitle', CONFIG.galleryTitle); set('galSub', CONFIG.gallerySub);
set('closing', CONFIG.closing); set('sign', CONFIG.signOff); set('footer', CONFIG.footer);

// ticker (list repeated so the loop is seamless)
const strip = [...CONFIG.wishes, ...CONFIG.wishes].map(w => `<span>🌸 ${w}</span>`).join('');
$('ticker').innerHTML = strip + strip;

// cards
$('cards').innerHTML = CONFIG.cards.map(c =>
  `<div class="card"><div class="ic">${c.icon}</div><h3>${c.title}</h3><p>${c.text}</p></div>`).join('');

// gallery — a photo that fails to load is simply hidden
$('gallery').innerHTML = CONFIG.photos.map(p =>
  `<figure><img src="${p.src}" alt="${p.caption}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>${p.caption}</figcaption></figure>`).join('');

// music
if (CONFIG.music) {
  const a = $('audio'), b = $('musicBtn');
  a.src = CONFIG.music; b.hidden = false;
  b.onclick = () => { if (a.paused) { a.play(); b.textContent = '⏸ Pause music'; } else { a.pause(); b.textContent = '🎵 Play music'; } };
}

// petals
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) {
  const bits = ['🌸','💛','🌼','💜'];
  setInterval(() => {
    const e = document.createElement('div');
    e.className = 'petal';
    e.textContent = bits[Math.floor(Math.random() * bits.length)];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.fontSize = (14 + Math.random() * 14) + 'px';
    e.style.animationDuration = (7 + Math.random() * 6) + 's';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 14000);
  }, 900);
}
</script>
</body>
</html>
